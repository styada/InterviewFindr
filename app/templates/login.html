{% extends "base.html" %}
{% block title %}Sign in — InterviewFindr{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white p-6 rounded-lg shadow-sm">
  <h1 class="text-xl font-semibold mb-4">Sign in</h1>
  <form hx-post="/auth/login" hx-target="#login-err" hx-swap="innerHTML" class="space-y-3">
    <div>
      <label class="block text-sm font-medium">Email</label>
      <input type="email" name="email" required class="mt-1 w-full border rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium">Password</label>
      <input type="password" name="password" required class="mt-1 w-full border rounded px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-slate-900 text-white rounded py-2 font-medium">Sign in</button>
    <div id="login-err" class="text-sm text-red-600"></div>
  </form>
</div>
{% endblock %}
